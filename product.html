<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Product Details — RN Jewellers</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- OneSignal Web Push SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>

  <!-- RATE TICKER -->
  <div class="rate-ticker-bar">
    <div class="container ticker-wrapper">
      <div class="ticker-items">
        <span class="ticker-badge">Live Market Rates</span>
        <span class="ticker-item"><i class="fas fa-coins"></i> 22K Gold: <strong id="ticker-gold-22k">₹7,200/g</strong></span>
        <span class="ticker-item"><i class="fas fa-coins"></i> 24K Gold: <strong id="ticker-gold-24k">₹7,850/g</strong></span>
        <span class="ticker-item"><i class="fas fa-ring"></i> Silver: <strong id="ticker-silver">₹92/g</strong></span>
      </div>
      <div class="ticker-actions">
        <a href="collections.html" class="ticker-link"><i class="fas fa-arrow-left"></i> Back to Catalog</a>
      </div>
    </div>
  </div>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <img src="assets/logo.png" alt="RN Jewellers Logo" class="logo-img">
        <span class="brand-title gold-gradient-text">RN JEWELLERS</span>
      </a>

      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="collections.html" class="nav-link active">Collections</a></li>
        <li><a href="custom-order.html" class="nav-link">Custom Order</a></li>
        <li><a href="about.html" class="nav-link">About Us</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <a href="wishlist.html" class="btn-icon" title="View Saved Wishlist">
          <i class="far fa-heart"></i>
          <span class="badge-count" id="wishlist-count-badge">0</span>
        </a>
        <button class="mobile-toggle" aria-label="Toggle menu">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- PRODUCT DETAIL SECTION -->
  <section class="section">
    <div class="container" id="product-detail-container">
      <!-- Rendered via product-detail.js -->
    </div>
  </section>

  <!-- RECENTLY VIEWED SECTION -->
  <section class="section" id="recently-viewed-section" style="background:var(--surface-1); border-top:1px solid var(--border-dark);">
    <div class="container">
      <div class="section-header">
        <span class="section-subtitle">RECOMMENDED FOR YOU</span>
        <h2 class="section-title">Recently Viewed Pieces</h2>
      </div>

      <div class="product-grid" id="recently-viewed-grid">
        <!-- Rendered via JS -->
      </div>
    </div>
  </section>

  <!-- FLOATING WHATSAPP BUTTON -->
  <a href="https://wa.me/918708853335" target="_blank" class="floating-whatsapp" aria-label="Contact on WhatsApp">
    <i class="fab fa-whatsapp"></i>
  </a>

  <!-- SCRIPTS -->
  <script src="js/config.js?v=2.6.0"></script>
  <script src="js/api.js?v=2.6.0"></script>
  <script src="js/main.js?v=2.6.0"></script>
  <script src="js/product-detail.js?v=2.6.0"></script>
  <script src="js/pwa.js?v=2.6.0"></script>
</body>
</html>
