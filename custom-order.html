<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Custom Order Design Request — RN Jewellers</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- OneSignal Web Push SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <img src="assets/logo.png" alt="RN Jewellers Logo" class="logo-img">
        <span class="brand-title gold-gradient-text">RN JEWELLERS</span>
      </a>

      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="collections.html" class="nav-link">Collections</a></li>
        <li><a href="custom-order.html" class="nav-link active">Custom Order</a></li>
        <li><a href="about.html" class="nav-link">About Us</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <a href="wishlist.html" class="btn-icon" title="View Saved Wishlist">
          <i class="far fa-heart"></i>
          <span class="badge-count" id="wishlist-count-badge">0</span>
        </a>
        <button class="mobile-toggle" aria-label="Toggle menu">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:750px;">
      <div style="text-align:center; margin-bottom:40px;">
        <span class="section-subtitle">BESPOKE CRAFTSMANSHIP</span>
        <h1 style="font-size:clamp(1.6rem, 5vw, 2.5rem); font-family:var(--font-heading);">Custom Jewellery Order Request</h1>
        <p style="color:var(--text-muted);">Upload your reference sketch or photo and let our master artisans bring your dream vision to reality.</p>
      </div>

      <div style="background:var(--surface-1); border:1px solid var(--border-gold); border-radius:var(--radius-lg); padding:clamp(18px, 5vw, 40px);">
        <form id="custom-order-form">
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:20px;">
            <div class="form-group">
              <label class="form-label">Your Name *</label>
              <input type="text" id="custom-name" class="form-control" required placeholder="Enter full name">
            </div>
            <div class="form-group">
              <label class="form-label">Phone / WhatsApp *</label>
              <input type="tel" id="custom-phone" class="form-control" required placeholder="+91 87088 53335">
            </div>
          </div>

          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:20px;">
            <div class="form-group">
              <label class="form-label">Jewellery Type *</label>
              <select id="custom-type" class="form-control" required>
                <option value="Rings">Rings</option>
                <option value="Men Ring">Men Ring</option>
                <option value="Girls Ring">Girls Ring</option>
                <option value="Necklace">Necklace / Choker</option>
                <option value="Earrings">Earrings</option>
                <option value="Bangles & Kadas">Bangles & Kadas</option>
                <option value="Men Kada">Men Kada</option>
                <option value="Kids Kada">Kids Kada</option>
                <option value="Payal">Payal (Anklet)</option>
                <option value="Boys Bracelet">Boys Bracelet</option>
                <option value="Girls Bracelet">Girls Bracelet</option>
                <option value="Chains & Pendants">Chains & Pendants</option>
                <option value="Men Chain">Men Chain</option>
                <option value="Girls Chain">Girls Chain</option>
                <option value="Kids Chain">Kids Chain</option>
                <option value="Bridal Sets">Bridal Sets</option>
                <option value="925 Silver Coins">925 Silver Coins</option>
                <option value="Silver Items">Silver Utensils / Items</option>
                <option value="Other Custom Design">Other Custom Design</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Preferred Metal & Purity *</label>
              <select id="custom-metal" class="form-control" required>
                <option value="925 Sterling Silver">925 Sterling Silver (92.5%)</option>
                <option value="Italian Silver">Italian Silver</option>
                <option value="999 Fine Silver">999 Fine Silver (99.9%)</option>
                <option value="Normal Silver">Normal / Traditional Silver</option>
                <option value="900 Coin Silver">900 Coin Silver</option>
                <option value="22K Gold">22K Gold (BIS 916)</option>
                <option value="24K Gold">24K Pure Gold</option>
                <option value="18K Gold">18K Gold / Diamond</option>
                <option value="14K Gold">14K Gold</option>
                <option value="Custom Purity Choice">Custom Choice (mention in details)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Est. Budget Range (₹)</label>
            <input type="text" id="custom-budget" class="form-control" placeholder="e.g. ₹50,000 - ₹1,000,000">
          </div>

          <div class="form-group">
            <label class="form-label">Design Specifications & Description</label>
            <textarea id="custom-desc" class="form-control" placeholder="Describe the design, gemstone preferences, size, weight preference etc."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Upload Reference Design Image (Photo or Sketch)</label>
            <input type="file" id="custom-image" accept="image/*" class="form-control">
            <img id="image-preview" src="" alt="Preview" style="display:none; margin-top:15px; max-height:180px; border-radius:8px; border:1px solid var(--border-gold);">
          </div>

          <button type="submit" class="btn btn-primary btn-block" style="padding:15px; margin-top:10px;">
            <i class="fas fa-palette"></i> Submit Custom Order Request
          </button>
        </form>
      </div>
    </div>
  </section>

  <!-- SCRIPTS -->
  <script src="js/config.js?v=2.7.0"></script>
  <script src="js/api.js?v=2.7.0"></script>
  <script src="js/main.js?v=2.7.0"></script>
  <script src="js/custom-order.js?v=2.7.0"></script>
  <script src="js/pwa.js?v=2.7.0"></script>
</body>
</html>
