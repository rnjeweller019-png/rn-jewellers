<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Saved Wishlist — RN Jewellers</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <!-- OneSignal Web Push SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <!-- ⚡ ZERO-FLASH THEME PRELOADER: Guarantees ONLY Google Sheet theme is ever shown -->
  <script>
    (function() {
      try {
        var s = localStorage.getItem('rnj_site_settings');
        if (s) {
          var p = JSON.parse(s);
          var r = document.documentElement;
          if (p.theme_bg) { r.style.setProperty('--bg-dark', p.theme_bg); document.documentElement.style.backgroundColor = p.theme_bg; }
          if (p.theme_surface_bg) { r.style.setProperty('--surface-1', p.theme_surface_bg); r.style.setProperty('--surface-2', p.theme_surface_bg); }
          if (p.theme_accent) { r.style.setProperty('--gold-primary', p.theme_accent); r.style.setProperty('--gold-light', p.theme_accent); }
          if (p.theme_text) r.style.setProperty('--text-main', p.theme_text);
          if (p.theme_muted_text) r.style.setProperty('--text-muted', p.theme_muted_text);
          if (p.theme_navbar_bg) r.style.setProperty('--surface-glass', p.theme_navbar_bg);
          if (p.theme_hero_sub) r.style.setProperty('--hero-sub-color', p.theme_hero_sub);
          if (p.theme_hero_title) r.style.setProperty('--hero-title-color', p.theme_hero_title);
          if (p.theme_hero_hl) r.style.setProperty('--hero-hl-color', p.theme_hero_hl);
          if (p.theme_hero_desc) r.style.setProperty('--hero-desc-color', p.theme_hero_desc);
        } else {
          // Brand-new first-time visitor: Shield page until Google Sheet theme arrives
          document.documentElement.classList.add('rnj-theme-pending');
          setTimeout(function() { document.documentElement.classList.remove('rnj-theme-pending'); }, 1200);
        }
      } catch(e) {}
    })();
  </script>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <img src="assets/logo.png" alt="RN Jewellers Logo" class="logo-img">
        <span class="brand-title gold-gradient-text">RN JEWELLERS</span>
      </a>

      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="collections.html" class="nav-link">Collections</a></li>
        <li><a href="custom-order.html" class="nav-link">Custom Order</a></li>
        <li><a href="about.html" class="nav-link">About Us</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <a href="wishlist.html" class="btn-icon" title="View Saved Wishlist">
          <i class="fas fa-heart" style="color:var(--gold-primary);"></i>
          <span class="badge-count" id="wishlist-count-badge">0</span>
        </a>
        <button class="mobile-toggle" aria-label="Toggle menu">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px; margin-bottom:40px; padding-bottom:20px; border-bottom:1px solid var(--border-dark);">
        <div>
          <h1 style="font-size:2.2rem; font-family:var(--font-heading);">Your Saved Favourites</h1>
          <p style="color:var(--text-muted);">Jewellery pieces saved for your upcoming occasion.</p>
        </div>
        <button id="share-wishlist-btn" class="btn btn-whatsapp" style="display:none;">
          <i class="fab fa-whatsapp"></i> Share Wishlist on WhatsApp
        </button>
      </div>

      <div class="product-grid" id="wishlist-grid">
        <!-- Rendered via JS -->
      </div>
    </div>
  </section>

  <!-- SCRIPTS -->
  <script src="js/config.js?v=3.8.0"></script>
  <script src="js/api.js?v=3.8.0"></script>
  <script src="js/main.js?v=3.8.0"></script>
  <script src="js/wishlist.js?v=3.8.0"></script>
  <script src="js/pwa.js?v=3.8.0"></script>
</body>
</html>
