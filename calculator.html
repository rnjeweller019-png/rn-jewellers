<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold & Silver Price Calculator — RN Jewellers</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- OneSignal Web Push SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <img src="assets/logo.png" alt="RN Jewellers Logo" class="logo-img">
        <span class="brand-title gold-gradient-text">RN JEWELLERS</span>
      </a>

      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="collections.html" class="nav-link">Collections</a></li>
        <li><a href="calculator.html" class="nav-link active">Calculator</a></li>
        <li><a href="custom-order.html" class="nav-link">Custom Order</a></li>
        <li><a href="about.html" class="nav-link">About Us</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <a href="wishlist.html" class="btn-icon" title="View Saved Wishlist">
          <i class="far fa-heart"></i>
          <span class="badge-count" id="wishlist-count-badge">0</span>
        </a>
        <button class="mobile-toggle" aria-label="Toggle menu">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:800px;">
      <div style="text-align:center; margin-bottom:40px;">
        <span class="section-subtitle">TRANSPARENT VALUE</span>
        <h1 style="font-size:2.5rem; font-family:var(--font-heading);">Gold & Silver Price Estimator</h1>
        <p style="color:var(--text-muted);">Calculate real-time estimates based on official market spot rates.</p>
      </div>

      <div style="background:var(--surface-1); border:1px solid var(--border-gold); border-radius:var(--radius-lg); padding:40px; box-shadow:var(--gold-glow);">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
          <div class="form-group">
            <label class="form-label">Metal Type</label>
            <select id="calc-metal" class="form-control">
              <option value="gold">Gold</option>
              <option value="silver">Silver</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Purity Grade</label>
            <select id="calc-purity" class="form-control">
              <option value="22K">22K Gold (BIS 916)</option>
              <option value="24K">24K Pure Gold</option>
              <option value="18K">18K Ornament Gold</option>
            </select>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top:15px;">
          <div class="form-group">
            <label class="form-label">Weight in Grams</label>
            <input type="number" id="calc-weight" class="form-control" value="15" min="0.1" step="0.1">
          </div>
          <div class="form-group">
            <label class="form-label">Estimated Making Charge (₹)</label>
            <input type="number" id="calc-making" class="form-control" value="3000">
          </div>
        </div>

        <div style="background:var(--surface-2); border:1px solid var(--border-dark); border-radius:var(--radius-md); padding:25px; margin-top:30px; text-align:center;">
          <div style="font-size:0.9rem; color:var(--text-muted);">Estimated Price Output</div>
          <div id="calc-total-result" style="font-size:3rem; font-weight:800; color:var(--gold-light); margin:10px 0;">₹0</div>
          <div id="calc-breakdown" style="font-size:0.9rem; color:var(--text-dim); margin-bottom:20px;"></div>

          <a href="custom-order.html" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Request Custom Quote</a>
        </div>
      </div>
    </div>
  </section>

  <!-- SCRIPTS -->
  <script src="js/config.js?v=1.1.1"></script>
  <script src="js/api.js?v=1.1.1"></script>
  <script src="js/main.js?v=1.1.1"></script>
  <script src="js/calculator.js?v=1.1.1"></script>
  <script src="js/pwa.js?v=1.1.1"></script>
</body>
</html>
