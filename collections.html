<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Jewellery Collections — RN Jewellers</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- OneSignal Web Push SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <!-- ⚡ ZERO-FLASH THEME PRELOADER: Guarantees ONLY Google Sheet theme is ever shown -->
  <script>
    (function() {
      try {
        var s = localStorage.getItem('rnj_site_settings');
        if (s) {
          var p = JSON.parse(s);
          var r = document.documentElement;
          if (p.theme_bg) { r.style.setProperty('--bg-dark', p.theme_bg); document.documentElement.style.backgroundColor = p.theme_bg; }
          if (p.theme_surface_bg) { r.style.setProperty('--surface-1', p.theme_surface_bg); r.style.setProperty('--surface-2', p.theme_surface_bg); }
          if (p.theme_accent) { r.style.setProperty('--gold-primary', p.theme_accent); r.style.setProperty('--gold-light', p.theme_accent); }
          if (p.theme_text) r.style.setProperty('--text-main', p.theme_text);
          if (p.theme_muted_text) r.style.setProperty('--text-muted', p.theme_muted_text);
          if (p.theme_navbar_bg) r.style.setProperty('--surface-glass', p.theme_navbar_bg);
          if (p.theme_hero_sub) r.style.setProperty('--hero-sub-color', p.theme_hero_sub);
          if (p.theme_hero_title) r.style.setProperty('--hero-title-color', p.theme_hero_title);
          if (p.theme_hero_hl) r.style.setProperty('--hero-hl-color', p.theme_hero_hl);
          if (p.theme_hero_desc) r.style.setProperty('--hero-desc-color', p.theme_hero_desc);
        } else {
          // Brand-new first-time visitor: Shield page until Google Sheet theme arrives
          document.documentElement.classList.add('rnj-theme-pending');
          setTimeout(function() { document.documentElement.classList.remove('rnj-theme-pending'); }, 1200);
        }
      } catch(e) {}
    })();
  </script>
</head>
<body>

  <!-- RATE TICKER -->
  <div class="rate-ticker-bar">
    <div class="container ticker-wrapper">
      <div class="ticker-items">
        <span class="ticker-badge">Live Market Rates</span>
        <span class="ticker-item"><i class="fas fa-coins"></i> 22K Gold: <strong id="ticker-gold-22k">₹7,200/g</strong></span>
        <span class="ticker-item"><i class="fas fa-coins"></i> 24K Gold: <strong id="ticker-gold-24k">₹7,850/g</strong></span>
        <span class="ticker-item"><i class="fas fa-ring"></i> Silver: <strong id="ticker-silver">₹92/g</strong></span>
      </div>
      <div class="ticker-actions">
        <a href="appointments.html" class="ticker-link"><i class="fas fa-calendar-check"></i> Book Visit</a>
      </div>
    </div>
  </div>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <img src="assets/logo.png" alt="RN Jewellers Logo" class="logo-img">
        <span class="brand-title gold-gradient-text">RN JEWELLERS</span>
      </a>

      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="collections.html" class="nav-link active">Collections</a></li>
        <li><a href="custom-order.html" class="nav-link">Custom Order</a></li>
        <li><a href="about.html" class="nav-link">About Us</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <a href="wishlist.html" class="btn-icon" title="View Saved Wishlist">
          <i class="far fa-heart"></i>
          <span class="badge-count" id="wishlist-count-badge">0</span>
        </a>
        <button class="mobile-toggle" aria-label="Toggle menu">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- PAGE HEADER -->
  <section style="background:var(--surface-1); border-bottom:1px solid var(--border-dark); padding:40px 0;">
    <div class="container" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px;">
      <div>
        <h1 style="font-size:clamp(1.5rem, 5vw, 2.2rem);">Jewellery Catalog &amp; Collections</h1>
        <p style="color:var(--text-muted);">Explore our masterfully handcrafted pure silver ornaments.</p>
      </div>
      <div id="product-count" style="background:var(--surface-2); border:1px solid var(--border-gold); padding:8px 16px; border-radius:var(--radius-full); font-weight:600; color:var(--gold-light);">
        Loading items...
      </div>
    </div>
  </section>

  <!-- CATALOG MAIN CONTENT -->
  <section class="section">
    <div class="container">
      <!-- FILTERS BAR -->
      <div style="background:var(--surface-1); border:1px solid var(--border-dark); padding:15px; border-radius:var(--radius-md); margin-bottom:35px; display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:12px; align-items:end;">
        <div>
          <label class="form-label" style="font-size:0.8rem;">Search Catalog</label>
          <input type="text" id="catalog-search" class="form-control" placeholder="Search ring, necklace...">
        </div>
        <div>
          <label class="form-label" style="font-size:0.8rem;">Category</label>
          <select id="filter-category" class="form-control">
            <option value="all">All Categories</option>
            <option value="rings">Rings</option>
            <option value="men_ring">Men Ring</option>
            <option value="girls_ring">Girls Ring</option>
            <option value="necklaces">Necklace</option>
            <option value="earrings">Earrings</option>
            <option value="bangles">Bangles & Kadas</option>
            <option value="men_kada">Men Kada</option>
            <option value="kids_kada">Kids Kada</option>
            <option value="payal">Payal</option>
            <option value="boys_bracelet">Boys Bracelet</option>
            <option value="girls_bracelet">Girls Bracelet</option>
            <option value="chains">Chains & Pendants</option>
            <option value="men_chain">Men Chain</option>
            <option value="girls_chain">Girls Chain</option>
            <option value="kids_chain">Kids Chain</option>
            <option value="sets">Bridal Sets</option>
            <option value="silver_coins">925 Silver Coins</option>
            <option value="silver_items">Silver Items</option>
          </select>
        </div>
        <div>
          <label class="form-label" style="font-size:0.8rem;">Metal</label>
          <select id="filter-metal" class="form-control">
            <option value="all">All Metals</option>
            <option value="gold">Gold</option>
            <option value="silver">Silver</option>
          </select>
        </div>
        <div>
          <label class="form-label" style="font-size:0.8rem;">Sort By</label>
          <select id="filter-sort" class="form-control">
            <option value="featured">Featured First</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="newest">New Arrivals</option>
          </select>
        </div>
      </div>

      <!-- PRODUCTS GRID -->
      <div class="product-grid" id="collections-grid">
        <!-- Rendered via JS -->
      </div>
    </div>
  </section>

  <!-- FLOATING WHATSAPP BUTTON -->
  <a href="https://wa.me/918708853335" target="_blank" class="floating-whatsapp" aria-label="Contact on WhatsApp">
    <i class="fab fa-whatsapp"></i>
  </a>

  <!-- SCRIPTS -->
  <script src="js/config.js?v=3.5.0"></script>
  <script src="js/api.js?v=3.5.0"></script>
  <script src="js/main.js?v=3.5.0"></script>
  <script src="js/products.js?v=3.5.0"></script>
  <script src="js/pwa.js?v=3.5.0"></script>
</body>
</html>
